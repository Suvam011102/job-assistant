<!DOCTYPE html>
<html>
<head>
  <title>Job Assistant</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1>Job Assistant</h1>
      <div class="header-right">
        <button id="themeToggle" class="theme-toggle">🌙</button>
        <span id="status">Idle</span>
      </div>
    </div>

    <!-- Chrome-style Tabs -->
    <div class="tab-bar">
      <div id="analyzerTab" class="tab active">Analyzer</div>
      <div id="libraryTab" class="tab">Library</div>
    </div>

    <!-- ================= ANALYZER SECTION ================= -->
    <div id="analyzerSection">

      <div class="section">
        <button id="startSelection" class="btn primary">Start Selection</button>
        <button id="stopSelection" class="btn secondary">Stop</button>
        <button id="resetSelection" class="btn danger">Reset Selection</button>
      </div>

      <div class="section horizontal">
        <button id="showOutput" class="btn secondary">Show</button>
        <button id="summarize" class="btn primary">Summarize</button>
        <button id="clearText" class="btn secondary">Clear</button>
      </div>

      <div class="content-section">
        <h2>Selected Job Content</h2>
        <textarea
          id="outputBox"
          placeholder="Selected job content will appear here...">
        </textarea>
      </div>

      <div class="summary-section">
        <h2>AI Summary</h2>
        <div id="summaryBox" class="summary-box">
          No summary generated yet.
        </div>
        <button id="saveSummary" class="btn success">
          Save Summary
        </button>
      </div>

    </div>

    <!-- ================= LIBRARY SECTION ================= -->
    <div id="librarySection" class="hidden">
      <h2>Saved Jobs</h2>
      <div id="libraryList"></div>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
