<!DOCTYPE html>
<html>
<head>
  <title>Job Selector</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Job Selector</h1>
      <span id="status">Idle</span>
    </div>

    <!-- ================= SELECTION SECTION ================= -->

    <div class="section">
      <button id="startSelection" class="btn primary">
        Start Selection
      </button>

      <button id="stopSelection" class="btn secondary">
        Stop
      </button>

      <button id="resetSelection" class="btn danger">
        Reset Selection
      </button>
    </div>

    <div class="section horizontal">
      <button id="showOutput" class="btn secondary">
        Show
      </button>

      <button id="summarize" class="btn primary">
        Summarize
      </button>

      <button id="clearText" class="btn secondary">
        Clear Text
      </button>
    </div>

    <textarea
      id="outputBox"
      placeholder="Selected job content will appear here...">
    </textarea>

    <!-- ================= AI SUMMARY SECTION ================= -->

    <div class="summary-section">
      <h2>AI Summary</h2>

      <div id="summaryBox" class="summary-box">
        No summary generated yet.
      </div>

      <button id="saveSummary" class="btn success">
        Save Summary
      </button>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
